# HTTP
quarkus.http.port=8080

# Postgres datasource — all values come from environment variables, never hardcoded.
# See .env.example for the variables docker-compose and this app both read.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}

# OpenAPI / Swagger UI — dev/test tooling only, never exposed in production builds.
quarkus.smallrye-openapi.info-title=Goal Tracker API
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
quarkus.swagger-ui.always-include=false
